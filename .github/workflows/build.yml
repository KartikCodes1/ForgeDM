name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go tests
        run: go test -race ./internal/...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check and build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

  windows:
    name: Windows app
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
            if (-not (Test-Path "$nsis\makensis.exe")) { throw "NSIS didn't install" }
            # NSIS doesn't add itself to PATH; Wails needs makensis there.
            $nsis | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Windows integration tests
        run: go test -v ./internal/platform/
      - name: Build ForgeDM.exe and installer
        run: wails build -platform windows/amd64 -nsis -trimpath -ldflags "-s -w" -skipbindings
      - name: Test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem build/bin -Filter "ForgeDM-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $setup) { throw "installer wasn't built" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\ForgeDM"
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "ForgeDM.lnk"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ForgeDM"
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"

          Write-Host "Fresh install"
          Start-Process $setup -ArgumentList "/S" -Wait
          foreach ($f in "ForgeDM.exe", "uninstall.exe") { if (-not (Test-Path "$dir\$f")) { throw "$f not installed" } }
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
          if ((Get-ItemProperty $uninstKey).DisplayName -ne "ForgeDM") { throw "not listed in Apps" }
          if (-not (Get-ItemProperty $runKey).ForgeDM) { throw "no start-with-Windows entry" }

          Write-Host "Update while ForgeDM is running"
          $p = Start-Process "$dir\ForgeDM.exe" -ArgumentList "--minimized" -PassThru
          $null = $p.Handle # keep the handle so ExitCode is readable later
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "ForgeDM exited right after starting (code $($p.ExitCode))" }
          Start-Process $setup -ArgumentList "/S" -Wait
          if (-not $p.WaitForExit(5000)) { throw "setup didn't close the running ForgeDM" }
          if ($p.ExitCode -ne 0) { throw "ForgeDM was forced closed (code $($p.ExitCode)) instead of quitting cleanly" }
          if (-not (Test-Path "$env:APPDATA\ForgeDM\config.json")) { throw "settings weren't saved" }
          if (-not (Test-Path "$dir\ForgeDM.exe")) { throw "update removed ForgeDM.exe" }

          Write-Host "Uninstall"
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\ForgeDM.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\ForgeDM.exe") { throw "ForgeDM.exe left behind" }
          if (Test-Path $lnk) { throw "Start menu shortcut left behind" }
          if (Test-Path $uninstKey) { throw "Apps entry left behind" }
          if ((Get-ItemProperty $runKey -ErrorAction SilentlyContinue).ForgeDM) { throw "startup entry left behind" }
          if (-not (Test-Path "$env:APPDATA\ForgeDM\config.json")) { throw "a silent uninstall shouldn't delete settings" }
          Write-Host "Installer OK"
      - name: Build the Store (MSIX) packages
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File build\windows\msix\build.ps1 -Test
          if ($LASTEXITCODE -ne 0) { throw "test package build failed" }
          $store = Get-Content build\windows\msix\store.json -Raw | ConvertFrom-Json
          if ($store.identityName) {
            powershell -NoProfile -ExecutionPolicy Bypass -File build\windows\msix\build.ps1
            if ($LASTEXITCODE -ne 0) { throw "Store package build failed" }
          } else {
            Write-Host "No Store identity in store.json yet: built the test package only."
          }
      - name: Test the Store package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $msix = (Get-ChildItem build\bin -Filter "ForgeDM-*-test.msix" | Select-Object -First 1).FullName
          Import-Certificate -FilePath build\bin\ForgeDM-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $msix
          $pkg = Get-AppxPackage -Name ForgeDM.Test
          if (-not $pkg) { throw "the package didn't install" }
          $pfn = $pkg.PackageFamilyName
          $dataDir = Join-Path $env:LOCALAPPDATA "Packages\$pfn\LocalState\ForgeDM"
          $alias = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\forgedm.exe"
          if (-not (Test-Path $alias)) { throw "the forgedm.exe command wasn't registered" }
          Write-Host "Installed $($pkg.PackageFullName)"

          Write-Host "Windows integrations inside the package"
          $report = Join-Path $env:RUNNER_TEMP "forgedm-diagnose.json"
          $p = Start-Process $alias -ArgumentList "--diagnose", $report -PassThru -Wait
          if (-not (Test-Path $report)) { throw "--diagnose wrote no report (exit code $($p.ExitCode))" }
          Get-Content $report
          $d = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $d.packaged) { throw "not running with package identity" }
          if ($d.dataDir -ne $dataDir) { throw "data folder is $($d.dataDir), expected $dataDir" }
          if (-not (Test-Path (Join-Path $dataDir "diagnose.txt"))) { throw "writes to the data folder were redirected" }
          if ($d.connectionCostError) { throw "metered-network check failed: $($d.connectionCostError)" }
          if ($d.startup.readError -or $d.startup.enableError) { throw "startup task failed: $($d.startup | ConvertTo-Json -Compress)" }
          if ($d.startup.afterEnable -ne 2) { throw "turning on start-with-Windows didn't work" }
          if ($d.startup.afterDisable -ne 0) { throw "turning off start-with-Windows didn't work" }
          if ($d.notificationError) { Write-Warning "Notification: $($d.notificationError)" }

          Write-Host "Run ForgeDM from the package"
          $app = Start-Process $alias -ArgumentList "--minimized" -PassThru
          $null = $app.Handle # keep the handle so ExitCode is readable later
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "ForgeDM exited right after starting (code $($app.ExitCode))" }
          if (-not (Test-Path (Join-Path $dataDir "config.json"))) { throw "settings weren't saved in the package folder" }
          $ping = Invoke-RestMethod -UseBasicParsing -Uri "http://127.0.0.1:52771/v1/ping"
          if ($ping.app -ne "ForgeDM") { throw "the browser connection isn't answering" }
          Start-Process $alias -ArgumentList "--quit" -Wait
          if (-not $app.WaitForExit(10000)) { throw "ForgeDM didn't quit" }
          if ($app.ExitCode -ne 0) { throw "ForgeDM exited with code $($app.ExitCode)" }

          Remove-AppxPackage -Package $pkg.PackageFullName
          if (Get-AppxPackage -Name ForgeDM.Test) { throw "the package didn't uninstall" }
          Write-Host "Store package OK"
      - name: Windows App Certification Kit
        shell: powershell
        continue-on-error: true
        timeout-minutes: 25
        run: |
          $appcert = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { Write-Warning "The App Certification Kit isn't installed on this runner; skipping."; exit 0 }
          $msix = (Get-ChildItem build\bin -Filter "ForgeDM-*-test.msix" | Select-Object -First 1).FullName
          $out = Join-Path $env:RUNNER_TEMP "wack.xml"
          & $appcert reset | Out-Null
          & $appcert test -appxpackagepath $msix -reportoutputpath $out
          if (-not (Test-Path $out)) { throw "no report" }
          [xml]$r = Get-Content $out
          Write-Host "Overall: $($r.REPORT.OVERALL_RESULT)"
          foreach ($t in $r.SelectNodes("//TEST")) {
            $res = $t.RESULT.'#cdata-section'
            if (-not $res) { $res = $t.RESULT }
            if ($res -and $res -ne "PASS") { Write-Host "$res - $($t.NAME): $($t.DESCRIPTION)"; $t.MESSAGES.MESSAGE | ForEach-Object { Write-Host "    $($_.TEXT)" } }
          }
          Copy-Item $out build\bin\wack-report.xml
          if ($r.REPORT.OVERALL_RESULT -eq "FAIL") { throw "certification tests failed" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build/bin/ForgeDM.exe release/ForgeDM.exe
          Copy-Item build/bin/ForgeDM-Setup-*.exe release/
          Compress-Archive -Path build/bin/ForgeDM.exe -DestinationPath release/ForgeDM-portable.zip -Force
          Compress-Archive -Path extension/dist/chrome/* -DestinationPath release/ForgeDM-extension-chrome.zip -Force
          Compress-Archive -Path extension/dist/firefox/* -DestinationPath release/ForgeDM-extension-firefox.zip -Force
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: ForgeDM-windows
          path: release/*
      - name: Upload the Store package
        uses: actions/upload-artifact@v4
        with:
          name: ForgeDM-store
          if-no-files-found: ignore
          path: |
            build/bin/ForgeDM-*.msix
            build/bin/wack-report.xml
            !build/bin/ForgeDM-*-test.msix
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
